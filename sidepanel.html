<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 16px;
      border-bottom: 1px solid #333;
    }
    h1 {
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      font-size: 12px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
    }
    .dot.connected { background: #22c55e; }

    .current-page {
      padding: 12px 16px;
      background: #16213e;
      border-bottom: 1px solid #333;
      font-size: 12px;
    }
    .current-page .url {
      color: #888;
      word-break: break-all;
      margin-top: 4px;
    }

    .log-container {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .log-entry {
      font-family: monospace;
      font-size: 11px;
      padding: 6px 8px;
      margin-bottom: 4px;
      background: #0f0f23;
      border-radius: 4px;
      word-break: break-all;
    }
    .log-entry.command { border-left: 3px solid #4f46e5; }
    .log-entry.response { border-left: 3px solid #22c55e; }
    .log-entry.error { border-left: 3px solid #ef4444; }
    .log-entry .time {
      color: #666;
      margin-right: 8px;
    }

    .actions {
      padding: 12px;
      border-top: 1px solid #333;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    button {
      padding: 8px;
      border: none;
      border-radius: 6px;
      background: #374151;
      color: white;
      cursor: pointer;
      font-size: 11px;
    }
    button:hover { background: #4b5563; }
    button.primary { background: #4f46e5; }
    button.primary:hover { background: #4338ca; }

    footer {
      padding: 8px 16px;
      border-top: 1px solid #333;
      font-size: 10px;
      color: #666;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <header>
    <h1>Claude Browser Proxy</h1>
    <div class="status">
      <div class="dot" id="statusDot"></div>
      <span id="statusText">Connecting...</span>
    </div>
  </header>

  <div class="current-page">
    <strong id="pageTitle">Loading...</strong>
    <div class="url" id="pageUrl"></div>
  </div>

  <div class="log-container" id="logContainer">
    <!-- Logs will appear here -->
  </div>

  <div class="actions">
    <button onclick="sendCommand('get_url')">Get URL</button>
    <button onclick="sendCommand('get_text')">Get Text</button>
    <button onclick="sendCommand('get_html')">Get HTML</button>
    <button onclick="sendCommand('get_videos')">Videos</button>
    <button onclick="sendCommand('screenshot')">Screenshot</button>
    <button class="primary" onclick="clearLog()">Clear</button>
  </div>

  <footer>
    <span>ws://localhost:9001</span>
    <span id="version"></span>
  </footer>

  <script>
    const logContainer = document.getElementById('logContainer');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');

    // Show version
    document.getElementById('version').textContent = 'v' + chrome.runtime.getManifest().version;

    // Update status
    async function updateStatus() {
      try {
        const response = await chrome.runtime.sendMessage({ action: 'status' });
        const connected = response?.connected || false;
        statusDot.classList.toggle('connected', connected);
        statusText.textContent = connected ? 'Connected to MQTT' : 'Disconnected';
      } catch (e) {
        statusText.textContent = 'Error: ' + e.message;
      }
    }

    // Update current page
    async function updateCurrentPage() {
      const [tab] = await chrome.tabs.query({ active: true, currentWindow: true });
      if (tab) {
        document.getElementById('pageTitle').textContent = tab.title || 'Unknown';
        document.getElementById('pageUrl').textContent = tab.url || '';
      }
    }

    // Add log entry
    function addLog(type, message) {
      const entry = document.createElement('div');
      entry.className = 'log-entry ' + type;
      const time = new Date().toLocaleTimeString();
      entry.innerHTML = '<span class="time">' + time + '</span>' +
        (typeof message === 'object' ? JSON.stringify(message, null, 2) : message);
      logContainer.appendChild(entry);
      logContainer.scrollTop = logContainer.scrollHeight;
    }

    // Send command via background
    function sendCommand(action) {
      const id = 'panel_' + Date.now();
      addLog('command', { action, id });

      // Send to background which will publish to MQTT
      chrome.runtime.sendMessage({
        action: 'command',
        command: { action, id }
      });
    }

    function clearLog() {
      logContainer.innerHTML = '';
    }

    // Listen for messages from background
    chrome.runtime.onMessage.addListener((msg) => {
      if (msg.type === 'mqtt_message') {
        addLog('response', msg.data);
      } else if (msg.type === 'mqtt_status') {
        updateStatus();
      }
    });

    // Initial updates
    updateStatus();
    updateCurrentPage();
    setInterval(updateStatus, 2000);
    setInterval(updateCurrentPage, 3000);

    addLog('response', 'Side panel ready. Send commands to test.');
  </script>
</body>
</html>
